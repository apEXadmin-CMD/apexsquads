<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize | Apex Squads</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background-color: #020617; }
        /* Cool background grid */
        .grid-bg { background-image: radial-gradient(circle at 2px 2px, #1e3a8a 1px, transparent 0); background-size: 32px 32px; }
    </style>
</head>
<body class="grid-bg text-white flex flex-col items-center justify-center min-h-screen">

    <div class="text-center mb-10 bg-black/50 p-6 border border-blue-900/50 backdrop-blur-sm rounded-xl">
        <h1 class="text-4xl font-black italic uppercase tracking-tighter">
            APEX<span class="text-blue-600">SQUADS</span>
        </h1>
        <p class="text-[10px] text-blue-500 uppercase tracking-[0.4em] mt-2">Operator Verification Required</p>
    </div>

    <div id="sign-in" class="shadow-[0_0_50px_rgba(0,102,255,0.1)]"></div>

  <script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_c3RpcnJlZC1lbGVwaGFudC0zNy5jbGVyay5hY2NvdW50cy5kZXYk"
  src="https://stirred-elephant-37.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript">
</script>
    <script>
      window.addEventListener('load', async function () {
        try {
            await Clerk.load();
            
            if (Clerk.user) {
              // If they are already logged in, send them to the home page
              window.location.href = "index.html";
            } else {
              // Force Clerk to return them to the /apexsquads/ folder after login!
              Clerk.mountSignIn(document.getElementById('sign-in'), {
                  afterSignInUrl: 'https://apexadmin-cmd.github.io/apexsquads/index.html',
                  afterSignUpUrl: 'https://apexadmin-cmd.github.io/apexsquads/index.html'
              });
            }
        } catch (error) {
            console.error(error);
            document.getElementById('sign-in').innerHTML = "<p class='text-red-500 text-sm font-bold bg-black p-4'>SYSTEM ERROR: Check your Clerk script tag.</p>";
        }
      });
    </script>

</body>
</html>
