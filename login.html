<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apex Squads | Secure Login</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">

    <div id="clerk-container" class="w-full max-w-md p-4">
        <h2 id="status" class="text-center text-blue-500 animate-pulse font-mono mb-4">
            INITIALIZING SECURE LINK...
        </h2>
        <div id="sign-in"></div>
    </div>

    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_c3RpcnJlZC1lbGVwaGFudC0zNy5jbGVyay5hY2NvdW50cy5kZXYk"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      type="text/javascript"
    ></script>

    <script>
      window.addEventListener('load', async function () {
        try {
            await Clerk.load();
            document.getElementById('status').innerText = "CONNECTION ESTABLISHED";
            
            if (!Clerk.user) {
                Clerk.mountSignIn(document.getElementById('sign-in'));
            } else {
                // User is already logged in, send them to home
                window.location.href = "index.html";
            }
        } catch (err) {
            document.getElementById('status').innerText = "ERROR: CHECK API KEY IN DASHBOARD";
            console.error(err);
        }
      });
    </script>
</body>
</html>
