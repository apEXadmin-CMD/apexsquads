<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authorize | Apex Squads</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white flex flex-col items-center justify-center min-h-screen" style="background-image: radial-gradient(circle at 2px 2px, #1a1a1a 1px, transparent 0); background-size: 24px 24px;">

    <div class="text-center mb-8">
        <h1 class="text-4xl font-black italic uppercase tracking-tighter">
            APEX<span class="text-blue-600">SQUADS</span>
        </h1>
        <p class="text-[10px] text-blue-500 uppercase tracking-[0.4em] mt-2">Secure Gateway</p>
    </div>

    <div id="auth-box" class="shadow-[0_0_50px_rgba(0,102,255,0.1)]"></div>

   <script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_test_c3RpcnJlZC1lbGVwaGFudC0zNy5jbGVyay5hY2NvdW50cy5kZXYk"
  src="https://stirred-elephant-37.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript">
</script>

    <script>
      window.addEventListener('load', async function () {
        try {
            await Clerk.load();
            
            if (Clerk.user) {
              // Already logged in? Go straight to HQ.
              window.location.href = "index.html";
            } else {
              // NOT logged in? Show the box and FORCE the return path for BOTH Login and Signup!
              Clerk.mountSignIn(document.getElementById('auth-box'), {
                  afterSignInUrl: 'https://apexadmin-cmd.github.io/apexsquads/index.html',
                  afterSignUpUrl: 'https://apexadmin-cmd.github.io/apexsquads/index.html'
              });
            }
        } catch (error) {
            console.error(error);
            document.getElementById('auth-box').innerHTML = "<p class='text-red-500'>Connection Error. Refresh.</p>";
        }
      });
    </script>

</body>
</html>
